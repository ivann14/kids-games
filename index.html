<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hry pre deti</title>
<style>
  :root {
    --bg: #e9f3f8; --panel: #ffffff; --ink: #1f2a44; --muted: #5b6784; --line: #1f2a44;
    --c1: #e5412d; --c2: #f6c10f; --c3: #38a85a; --c4: #2f6fd6; --c5: #8b4fc2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141b2d; --panel: #1f2942; --ink: #f1f5ff; --muted: #a6b2d1; --line: #f1f5ff; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI Rounded", system-ui, sans-serif;
    display: flex; justify-content: center;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  main { width: 100%; max-width: 480px; padding: 24px 16px 32px; display: flex; flex-direction: column; gap: 18px; }
  h1 { margin: 0; font-size: clamp(30px, 9vw, 42px); font-weight: 800; text-align: center; }
  .games { display: grid; gap: 16px; }
  .game {
    display: flex; align-items: center; gap: 16px;
    background: var(--panel); color: var(--ink); text-decoration: none;
    border: 4px solid var(--line); border-radius: 22px; padding: 14px 16px;
    box-shadow: 0 6px 0 var(--line);
  }
  .game:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--line); }
  .game:focus-visible { outline: 4px solid var(--c4); outline-offset: 3px; }
  .dots { display: grid; grid-template-columns: repeat(3, 18px); gap: 4px; }
  .dots i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); display: block; }
  .dots i:nth-child(5n+1) { background: var(--c1); }
  .dots i:nth-child(5n+2) { background: var(--c2); }
  .dots i:nth-child(5n+3) { background: var(--c3); }
  .dots i:nth-child(5n+4) { background: var(--c4); }
  .dots i:nth-child(5n+5) { background: var(--c5); }
  .game b { display: block; font-size: 22px; }
  .game span { color: var(--muted); font-size: 16px; }
</style>
</head>
<body>
<main>
  <h1>Hry pre deti</h1>
  <div class="games">
    <a class="game" href="sudoku/">
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div><b>Farebné sudoku</b><span>4×4 a 5×5, farby namiesto čísel</span></div>
    </a>
  </div>
</main>
</body>
</html>
