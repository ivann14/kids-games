<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Preskakovaná</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#e9f3f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141b2d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Preskakovaná">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #e9f3f8;
    --panel: #ffffff;
    --ink: #1f2a44;
    --muted: #5b6784;
    --line: #1f2a44;
    --light-sq: #f3dfbf;
    --dark-sq: #b98a5e;
    --red: #e5412d;
    --blue: #2f6fd6;
    --accent: #1f2a44;
    --accent-ink: #ffffff;
    --hl: #ffd84d;
    --last: rgba(255, 216, 77, .55);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141b2d;
      --panel: #1f2942;
      --ink: #f1f5ff;
      --muted: #a6b2d1;
      --line: #f1f5ff;
      --light-sq: #d9c4a3;
      --dark-sq: #8f6a48;
      --accent: #f1f5ff;
      --accent-ink: #1f2a44;
      --hl: #ffd84d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141b2d;
    --panel: #1f2942;
    --ink: #f1f5ff;
    --muted: #a6b2d1;
    --line: #f1f5ff;
    --light-sq: #d9c4a3;
    --dark-sq: #8f6a48;
    --accent: #f1f5ff;
    --accent-ink: #1f2a44;
  }
  html { touch-action: pan-x pan-y; }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: "Baloo 2", "Trebuchet MS", "Segoe UI Rounded", system-ui, sans-serif;
  }
  /* Board takes all the room left after the two thin player strips. */
  main {
    --strip: 34px;
    --gap: 6px;
    --board: min(calc(100vw - 16px), calc(100vh - 2 * var(--strip) - 4 * var(--gap) - 14px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)));
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--gap);
  }
  @supports (height: 100dvh) {
    main { --board: min(calc(100vw - 16px), calc(100dvh - 2 * var(--strip) - 4 * var(--gap) - 14px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))); }
  }

  /* Player strips sit on their side of the board; the top one is upside down for the kid across the table. */
  .player {
    width: var(--board);
    height: var(--strip);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 18px;
    font-weight: 700;
    color: var(--muted);
  }
  .player.top { transform: rotate(180deg); }
  .player .dot {
    width: 24px; height: 24px; border-radius: 50%;
    border: 3px solid var(--line); flex: none;
  }

  .board-wrap {
    width: var(--board);
    border: 4px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 5px 0 var(--line);
    touch-action: none;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    aspect-ratio: 1;
  }
  .sq {
    position: relative;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    background: var(--light-sq);
  }
  .sq.dark { background: var(--dark-sq); }
  .sq.last::before {
    content: ""; position: absolute; inset: 0;
    background: var(--last);
  }
  .sq.drop::after {
    content: ""; position: absolute; inset: 0;
    box-shadow: inset 0 0 0 4px var(--hl);
  }
  .piece {
    position: relative;
    width: 78%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 3px solid #1f2a44;
    box-shadow: inset -4px -5px 0 rgba(0,0,0,.18), 0 3px 0 rgba(0,0,0,.25);
    transition: transform .12s ease;
    pointer-events: none;
  }
  .piece::after {
    content: ""; position: absolute;
    left: 22%; top: 18%; width: 26%; height: 22%;
    border-radius: 50%; background: rgba(255,255,255,.45);
  }
  .piece.red { background: var(--red); }
  .piece.blue { background: var(--blue); }
  .sq.movable { cursor: grab; }
  .sq.sel .piece {
    transform: translateY(-6%) scale(1.12);
    box-shadow: 0 0 0 4px var(--hl), 0 6px 0 rgba(0,0,0,.3);
  }
  .sq.dragging .piece { opacity: .3; }
  .ghost {
    position: fixed;
    z-index: 20;
    pointer-events: none;
    transform: translate(-50%, -60%) scale(1.15);
  }

  /* Settings live behind a small, quiet gear so nothing else distracts from the board. */
  .menu-btn {
    position: fixed;
    right: calc(8px + env(safe-area-inset-right, 0px));
    bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    width: 40px; height: 40px;
    border: 0; border-radius: 50%;
    background: transparent; color: var(--muted);
    font-size: 24px; line-height: 1; cursor: pointer;
    opacity: .55;
  }
  .menu {
    border: 4px solid var(--line);
    border-radius: 22px;
    background: var(--panel);
    color: var(--ink);
    padding: 18px;
    width: min(92vw, 360px);
    box-shadow: 0 6px 0 var(--line);
  }
  .menu::backdrop { background: rgba(20, 27, 45, .45); }
  .menu .col { display: flex; flex-direction: column; gap: 12px; }
  .menu a.btn { text-decoration: none; text-align: center; }
  .rules { color: var(--muted); font-size: 16px; line-height: 1.3; text-align: center; margin: 0; }

  .win {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 15;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: 4px solid var(--line);
    border-radius: 22px;
    padding: 16px 24px;
    box-shadow: 0 6px 0 var(--line);
  }
  .win.show { display: flex; }
  .msg { font-size: 26px; font-weight: 800; text-align: center; margin: 0; }
  .btn {
    font: inherit;
    font-weight: 700;
    font-size: 18px;
    border: 3px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    border-radius: 999px;
    padding: 6px 18px;
    min-height: 46px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--line);
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .btn:disabled { opacity: .4; cursor: default; box-shadow: 0 4px 0 var(--line); transform: none; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn:focus-visible, .menu-btn:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }

  .win-overlay { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
  .conf {
    position: absolute; top: -20px; width: 14px; height: 14px; border-radius: 3px;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) {
    .piece { transition: none; }
    .conf { display: none; }
  }
</style>
</head>
<body>
<main>
  <div class="player top">
    <span class="dot" style="background: var(--blue)"></span>
    <span id="sBlue"></span>
  </div>

  <div class="board-wrap"><div class="board" id="board" role="grid" aria-label="Šachovnica 8 krát 8"></div></div>

  <div class="player bottom">
    <span class="dot" style="background: var(--red)"></span>
    <span id="sRed"></span>
  </div>
</main>

<button class="menu-btn" id="menuBtn" aria-label="Nastavenia">⚙</button>

<dialog class="menu" id="menu">
  <div class="col">
    <button class="btn primary" id="newBtn">Nová hra</button>
    <button class="btn" id="undoBtn" aria-label="Späť o jeden ťah">↶ Späť</button>
    <a class="btn" href="../">⌂ Všetky hry</a>
    <p class="rules">Figúrka ide o políčko ktorýmkoľvek smerom alebo preskakuje cez iné figúrky – aj viackrát za sebou. Kto prvý dostane všetkých 8 figúrok do súperových dvoch radov, vyhráva.</p>
    <button class="btn" id="closeBtn">Zavrieť</button>
  </div>
</dialog>

<div class="win" id="winBox" aria-live="polite">
  <p class="msg" id="msg"></p>
  <button class="btn primary" id="againBtn">Hrať znova</button>
</div>
<div class="win-overlay" id="win"></div>

<script>
(function () {
  var N = 8;
  // Red starts on the dark squares of the bottom two rows and aims for the top two; blue the other way round.
  var PLAYERS = {
    red:  { name: "Červený", start: [N - 2, N - 1], goal: [0, 1] },
    blue: { name: "Modrý",   start: [0, 1],         goal: [N - 2, N - 1] }
  };
  var COUNT = 8;

  // No turn order: kids take turns themselves and may fix any piece at any time.
  var grid, lastMoved, lastFrom, history, winner, selected;
  var boardEl = document.getElementById("board");
  var msgEl = document.getElementById("msg");
  var undoBtn = document.getElementById("undoBtn");

  function canMove(r, c) {
    return !winner && !!grid[r][c];
  }

  function inGoal(p) {
    var n = 0, rows = PLAYERS[p].goal;
    for (var i = 0; i < rows.length; i++) {
      for (var c = 0; c < N; c++) if (grid[rows[i]][c] === p) n++;
    }
    return n;
  }

  function render() {
    boardEl.innerHTML = "";
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var d = document.createElement("div");
        var p = grid[r][c];
        d.className = "sq" + ((r + c) % 2 ? " dark" : "") +
          (canMove(r, c) ? " movable" : "") +
          (selected && selected[0] === r && selected[1] === c ? " sel" : "") +
          ((lastMoved && lastMoved[0] === r && lastMoved[1] === c) ||
           (lastFrom && lastFrom[0] === r && lastFrom[1] === c) ? " last" : "");
        d.dataset.r = r; d.dataset.c = c;
        d.setAttribute("role", "gridcell");
        d.setAttribute("aria-label", String.fromCharCode(97 + c) + (N - r) + ": " +
          (p ? PLAYERS[p].name.toLowerCase() : "prázdne"));
        if (p) d.innerHTML = '<span class="piece ' + p + '"></span>';
        boardEl.appendChild(d);
      }
    }
    document.getElementById("sRed").textContent = inGoal("red") + " / " + COUNT;
    document.getElementById("sBlue").textContent = inGoal("blue") + " / " + COUNT;
    undoBtn.disabled = history.length === 0;
    if (!winner) setMsg("");
  }

  var winBox = document.getElementById("winBox");
  function setMsg(t, color) {
    msgEl.textContent = t;
    msgEl.style.color = color || "var(--ink)";
    winBox.classList.toggle("show", !!t);
  }

  function confetti() {
    var wrap = document.getElementById("win");
    wrap.innerHTML = "";
    var cols = ["#e5412d", "#f6c10f", "#38a85a", "#2f6fd6", "#8b4fc2"];
    for (var i = 0; i < 70; i++) {
      var d = document.createElement("div");
      d.className = "conf";
      d.style.left = Math.random() * 100 + "vw";
      d.style.background = cols[i % cols.length];
      d.style.animationDuration = (2 + Math.random() * 2) + "s";
      d.style.animationDelay = (Math.random() * 0.6) + "s";
      wrap.appendChild(d);
    }
    setTimeout(function () { wrap.innerHTML = ""; }, 5000);
  }

  function move(fr, fc, tr, tc) {
    if (grid[tr][tc] || (fr === tr && fc === tc)) return false;
    var p = grid[fr][fc];
    history.push({ fr: fr, fc: fc, tr: tr, tc: tc, lastMoved: lastMoved, lastFrom: lastFrom });
    grid[tr][tc] = p;
    grid[fr][fc] = null;
    // Remember where this piece's whole run of moves began, for the yellow trail.
    var continuing = lastMoved && lastMoved[0] === fr && lastMoved[1] === fc;
    lastFrom = continuing ? lastFrom : [fr, fc];
    lastMoved = [tr, tc];
    selected = null;
    if (inGoal(p) === COUNT) {
      winner = p;
      render();
      setMsg(PLAYERS[p].name + " vyhráva! 🎉", p === "red" ? "var(--red)" : "var(--blue)");
      confetti();
    } else {
      render();
    }
    return true;
  }

  function newGame() {
    grid = [];
    for (var r = 0; r < N; r++) {
      grid.push([]);
      for (var c = 0; c < N; c++) grid[r].push(null);
    }
    ["red", "blue"].forEach(function (p) {
      PLAYERS[p].start.forEach(function (row) {
        for (var c = 0; c < N; c++) if ((row + c) % 2) grid[row][c] = p; // dark squares only
      });
    });
    lastMoved = lastFrom = selected = null;
    history = [];
    winner = null;
    document.getElementById("win").innerHTML = "";
    render();
  }

  // ---- input: tap piece then tap square, or drag the piece ----
  var drag = null; // { r, c, x, y, ghost, el }

  function squareAt(x, y) {
    var el = document.elementFromPoint(x, y);
    var sq = el && el.closest && el.closest(".sq");
    return sq && boardEl.contains(sq) ? sq : null;
  }

  function clearDrop() {
    var d = boardEl.querySelector(".sq.drop");
    if (d) d.classList.remove("drop");
  }

  boardEl.addEventListener("pointerdown", function (ev) {
    var sq = ev.target.closest(".sq");
    if (!sq) return;
    var r = Number(sq.dataset.r), c = Number(sq.dataset.c);
    if (canMove(r, c)) {
      ev.preventDefault();
      drag = { r: r, c: c, x: ev.clientX, y: ev.clientY, ghost: null, el: sq, id: ev.pointerId };
      boardEl.setPointerCapture(ev.pointerId);
    } else if (selected && !grid[r][c]) {
      move(selected[0], selected[1], r, c);
    } else {
      selected = null;
      render();
    }
  });

  boardEl.addEventListener("pointermove", function (ev) {
    if (!drag || ev.pointerId !== drag.id) return;
    if (!drag.ghost) {
      if (Math.abs(ev.clientX - drag.x) + Math.abs(ev.clientY - drag.y) < 8) return;
      var piece = drag.el.querySelector(".piece");
      var g = piece.cloneNode(true);
      var size = piece.getBoundingClientRect().width;
      g.classList.add("ghost");
      g.style.width = size + "px";
      document.body.appendChild(g);
      drag.ghost = g;
      drag.el.classList.add("dragging");
    }
    drag.ghost.style.left = ev.clientX + "px";
    drag.ghost.style.top = ev.clientY + "px";
    clearDrop();
    var sq = squareAt(ev.clientX, ev.clientY);
    if (sq && !grid[Number(sq.dataset.r)][Number(sq.dataset.c)]) sq.classList.add("drop");
  });

  function endDrag(ev, cancelled) {
    if (!drag || ev.pointerId !== drag.id) return;
    var d = drag;
    drag = null;
    clearDrop();
    if (d.ghost) {
      d.ghost.remove();
      d.el.classList.remove("dragging");
      var sq = cancelled ? null : squareAt(ev.clientX, ev.clientY);
      if (!sq || !move(d.r, d.c, Number(sq.dataset.r), Number(sq.dataset.c))) render();
      return;
    }
    // Plain tap: pick the piece up, or put it back down if it was already picked.
    selected = selected && selected[0] === d.r && selected[1] === d.c ? null : [d.r, d.c];
    render();
  }
  boardEl.addEventListener("pointerup", function (ev) { endDrag(ev, false); });
  boardEl.addEventListener("pointercancel", function (ev) { endDrag(ev, true); });

  var menu = document.getElementById("menu");
  document.getElementById("menuBtn").addEventListener("click", function () { menu.showModal(); });
  document.getElementById("closeBtn").addEventListener("click", function () { menu.close(); });
  // Tap on the dimmed backdrop closes the menu too.
  menu.addEventListener("click", function (ev) { if (ev.target === menu) menu.close(); });

  document.getElementById("newBtn").addEventListener("click", function () {
    if (history.length && !winner && !confirm("Začať novú hru?")) return;
    menu.close();
    newGame();
  });
  document.getElementById("againBtn").addEventListener("click", newGame);

  undoBtn.addEventListener("click", function () {
    var m = history.pop();
    if (!m) return;
    grid[m.fr][m.fc] = grid[m.tr][m.tc];
    grid[m.tr][m.tc] = null;
    lastMoved = m.lastMoved;
    lastFrom = m.lastFrom;
    selected = null;
    winner = null;
    document.getElementById("win").innerHTML = "";
    menu.close();
    render();
  });

  newGame();
})();

// iOS Safari ignores user-scalable=no; block pinch via its gesture events.
['gesturestart', 'gesturechange', 'gestureend'].forEach((t) =>
  document.addEventListener(t, (e) => e.preventDefault(), { passive: false })
);
document.addEventListener('touchmove', (e) => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
document.addEventListener('contextmenu', (e) => e.preventDefault());

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
