<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Preskakovaná</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#e9f3f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141b2d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Preskakovaná">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #e9f3f8;
    --panel: #ffffff;
    --ink: #1f2a44;
    --muted: #5b6784;
    --line: #1f2a44;
    --light-sq: #f3dfbf;
    --dark-sq: #b98a5e;
    --red: #e5412d;
    --blue: #2f6fd6;
    --accent: #1f2a44;
    --accent-ink: #ffffff;
    --hl: #ffd84d;
    --last: rgba(255, 216, 77, .55);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141b2d;
      --panel: #1f2942;
      --ink: #f1f5ff;
      --muted: #a6b2d1;
      --line: #f1f5ff;
      --light-sq: #d9c4a3;
      --dark-sq: #8f6a48;
      --accent: #f1f5ff;
      --accent-ink: #1f2a44;
      --hl: #ffd84d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141b2d;
    --panel: #1f2942;
    --ink: #f1f5ff;
    --muted: #a6b2d1;
    --line: #f1f5ff;
    --light-sq: #d9c4a3;
    --dark-sq: #8f6a48;
    --accent: #f1f5ff;
    --accent-ink: #1f2a44;
  }
  html { touch-action: pan-x pan-y; }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: "Baloo 2", "Trebuchet MS", "Segoe UI Rounded", system-ui, sans-serif;
  }
  /* Board takes all the room left after the two thin player strips. */
  main {
    --strip: 34px;
    --gap: 6px;
    --board: min(calc(100vw - 16px), calc(100vh - 2 * var(--strip) - 4 * var(--gap) - 14px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)));
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--gap);
  }
  @supports (height: 100dvh) {
    main { --board: min(calc(100vw - 16px), calc(100dvh - 2 * var(--strip) - 4 * var(--gap) - 14px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))); }
  }

  /* Player strips sit on their side of the board; the top one is upside down for the kid across the table. */
  .player {
    width: var(--board);
    height: var(--strip);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 18px;
    font-weight: 700;
    color: var(--muted);
  }
  .player.top { transform: rotate(180deg); }
  .player .dot {
    position: relative; overflow: hidden;
    width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid #1f2a44; flex: none;
  }

  .board-wrap {
    width: var(--board);
    border: 4px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 5px 0 var(--line);
    touch-action: none;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    aspect-ratio: 1;
  }
  .sq {
    position: relative;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    background: var(--light-sq);
  }
  .sq.dark { background: var(--dark-sq); }
  .sq.last::before {
    content: ""; position: absolute; inset: 0;
    background: var(--last);
  }
  .sq.drop::after {
    content: ""; position: absolute; inset: 0;
    box-shadow: inset 0 0 0 4px var(--hl);
  }
  /* Light square: not allowed. Red frame while hovering, short red blink after a wrong tap or drop. */
  .sq.nodrop::after {
    content: ""; position: absolute; inset: 0;
    box-shadow: inset 0 0 0 5px var(--red);
  }
  .sq.nodrop.blink::after { animation: nodrop .3s ease 3; }
  @keyframes nodrop { 50% { box-shadow: inset 0 0 0 5px transparent; } }
  .piece {
    position: relative;
    width: 88%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 3px solid #1f2a44;
    overflow: hidden;
    box-shadow: inset -4px -5px 0 rgba(0,0,0,.18), 0 3px 0 rgba(0,0,0,.25);
    transition: transform .12s ease;
    pointer-events: none;
  }
  .piece svg, .dot svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .piece.red { background: var(--red); }
  .piece.blue { background: var(--blue); }
  .sq.movable { cursor: grab; }
  .sq.sel .piece {
    transform: translateY(-6%) scale(1.12);
    box-shadow: 0 0 0 4px var(--hl), 0 6px 0 rgba(0,0,0,.3);
  }
  .sq.dragging .piece { opacity: .3; }
  .ghost {
    position: fixed;
    z-index: 20;
    pointer-events: none;
    transform: translate(-50%, -60%) scale(1.15);
  }

  /* Settings live behind a small, quiet gear so nothing else distracts from the board. */
  .menu-btn {
    position: fixed;
    right: calc(8px + env(safe-area-inset-right, 0px));
    bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    width: 40px; height: 40px;
    border: 0; border-radius: 50%;
    background: transparent; color: var(--muted);
    font-size: 24px; line-height: 1; cursor: pointer;
    opacity: .55;
  }
  .menu {
    border: 4px solid var(--line);
    border-radius: 22px;
    background: var(--panel);
    color: var(--ink);
    padding: 18px;
    width: min(92vw, 360px);
    box-shadow: 0 6px 0 var(--line);
  }
  .menu::backdrop { background: rgba(20, 27, 45, .45); }
  .menu .col { display: flex; flex-direction: column; gap: 12px; }
  .pic-row { display: flex; align-items: center; gap: 10px; }
  .pic-row .dot {
    position: relative; overflow: hidden; flex: none;
    width: 44px; height: 44px; border-radius: 50%; border: 3px solid #1f2a44;
  }
  .pic-row .btn { flex: 1; padding: 4px 10px; font-size: 16px; min-height: 40px; }
  .pic-row .btn.x { flex: none; width: 40px; padding: 0; }
  .piece img, .dot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .menu a.btn { text-decoration: none; text-align: center; }
  .rules { color: var(--muted); font-size: 16px; line-height: 1.3; text-align: center; margin: 0; }

  .win {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 15;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: 4px solid var(--line);
    border-radius: 22px;
    padding: 16px 24px;
    box-shadow: 0 6px 0 var(--line);
  }
  .win.show { display: flex; }
  .msg { font-size: 26px; font-weight: 800; text-align: center; margin: 0; }
  .btn {
    font: inherit;
    font-weight: 700;
    font-size: 18px;
    border: 3px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    border-radius: 999px;
    padding: 6px 18px;
    min-height: 46px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--line);
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .btn:disabled { opacity: .4; cursor: default; box-shadow: 0 4px 0 var(--line); transform: none; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn:focus-visible, .menu-btn:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }

  .win-overlay { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
  .conf {
    position: absolute; top: -20px; width: 14px; height: 14px; border-radius: 3px;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) {
    .piece { transition: none; }
    .conf { display: none; }
  }
</style>
</head>
<body>
<main>
  <div class="player top">
    <span class="dot" id="dBlue" style="background: var(--blue)"></span>
    <span id="sBlue"></span>
  </div>

  <div class="board-wrap"><div class="board" id="board" role="grid" aria-label="Šachovnica 8 krát 8"></div></div>

  <div class="player bottom">
    <span class="dot" id="dRed" style="background: var(--red)"></span>
    <span id="sRed"></span>
  </div>
</main>

<button class="menu-btn" id="menuBtn" aria-label="Nastavenia">⚙</button>

<dialog class="menu" id="menu">
  <div class="col">
    <button class="btn primary" id="newBtn">Nová hra</button>
    <button class="btn" id="undoBtn" aria-label="Späť o jeden ťah">↶ Späť</button>
    <div class="pic-row">
      <span class="dot" id="mBlue" style="background: var(--blue)"></span>
      <button class="btn" data-pick="blue">Obrázok modrých</button>
      <button class="btn x" data-clear="blue" aria-label="Vrátiť psíka modrým">✕</button>
    </div>
    <div class="pic-row">
      <span class="dot" id="mRed" style="background: var(--red)"></span>
      <button class="btn" data-pick="red">Obrázok červených</button>
      <button class="btn x" data-clear="red" aria-label="Vrátiť psíka červeným">✕</button>
    </div>
    <input type="file" id="picFile" accept="image/*" hidden>
    <a class="btn" href="../">⌂ Všetky hry</a>
    <p class="rules">Figúrky chodia len po tmavých poliach, teda šikmo. Figúrka ide o políčko alebo preskakuje cez iné figúrky – aj viackrát za sebou. Policajný psík (bígl) hrá za modrých, hasičský psík za červených. Kto prvý dostane všetkých 8 psíkov do súperových dvoch radov, vyhráva.</p>
    <button class="btn" id="closeBtn">Zavrieť</button>
  </div>
</dialog>

<div class="win" id="winBox" aria-live="polite">
  <p class="msg" id="msg"></p>
  <button class="btn primary" id="againBtn">Hrať znova</button>
</div>
<div class="win-overlay" id="win"></div>

<script>
(function () {
  var N = 8;
  // Red starts on the dark squares of the bottom two rows and aims for the top two; blue the other way round.
  var PLAYERS = {
    red:  { name: "Hasičský psík", start: [N - 2, N - 1], goal: [0, 1] },
    blue: { name: "Policajný psík", start: [0, 1],         goal: [N - 2, N - 1] }
  };
  var COUNT = 8;

  // Original cartoon puppies drawn for this game: a beagle police pup (blue team)
  // and a dalmatian fire pup (red team). Thick outlines + big shiny eyes for a cartoon look.
  var O = ' stroke="#1f2a44" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"';
  function eyes(iris) {
    return '<ellipse cx="39" cy="58" rx="7.5" ry="9"' + O + ' fill="#fff"/>' +
      '<ellipse cx="61" cy="58" rx="7.5" ry="9"' + O + ' fill="#fff"/>' +
      '<circle cx="40" cy="60" r="5.6" fill="' + iris + '"/><circle cx="60" cy="60" r="5.6" fill="' + iris + '"/>' +
      '<circle cx="40" cy="60.5" r="3.2" fill="#1f2a44"/><circle cx="60" cy="60.5" r="3.2" fill="#1f2a44"/>' +
      '<circle cx="42.2" cy="57.6" r="2" fill="#fff"/><circle cx="62.2" cy="57.6" r="2" fill="#fff"/>' +
      '<circle cx="38.3" cy="62.6" r=".9" fill="#fff"/><circle cx="58.3" cy="62.6" r=".9" fill="#fff"/>';
  }
  var MOUTH =
    '<ellipse cx="29" cy="70" rx="5" ry="3" fill="#ff8fa3" opacity=".7"/>' +
    '<ellipse cx="71" cy="70" rx="5" ry="3" fill="#ff8fa3" opacity=".7"/>' +
    '<path d="M42 73 Q50 86 58 73 Z"' + O + ' fill="#8a1f2c"/>' +
    '<path d="M45.5 78.5 Q50 75 54.5 78.5 Q53 83 50 83 Q47 83 45.5 78.5 Z" fill="#ff7a8a"/>' +
    '<path d="M44.5 69.5 Q50 63.5 55.5 69.5 Q55 73.5 50 73.5 Q45 73.5 44.5 69.5 Z"' + O + ' fill="#1f2a44"/>' +
    '<ellipse cx="48" cy="67.8" rx="2" ry="1" fill="#fff" opacity=".8"/>';
  var FACES = {
    blue: '<svg viewBox="10 9 80 80" aria-hidden="true">' +
      // floppy beagle ears
      '<path d="M26 48 Q12 52 15 74 Q18 84 27 78 Q30 64 31 52 Z"' + O + ' fill="#8a4b22"/>' +
      '<path d="M74 48 Q88 52 85 74 Q82 84 73 78 Q70 64 69 52 Z"' + O + ' fill="#8a4b22"/>' +
      // head, white blaze and muzzle
      '<path d="M50 38 Q78 38 79 62 Q79 86 50 86 Q21 86 21 62 Q22 38 50 38 Z"' + O + ' fill="#d98c45"/>' +
      '<path d="M46 44 Q50 41 54 44 L56 62 Q66 64 66 74 Q64 86 50 86 Q36 86 34 74 Q34 64 44 62 Z" fill="#fff6ea"/>' +
      eyes("#7a4a1e") +
      '<path d="M32 47 Q37 44.5 42 47 M58 47 Q63 44.5 68 47"' + O + ' fill="none"/>' + MOUTH +
      // police cap: crown, band, visor, star badge
      '<path d="M22 44 Q20 26 50 22 Q80 26 78 44 Z"' + O + ' fill="#2f6fd6"/>' +
      '<path d="M30 30 Q50 24 70 30" stroke="#6fa0ef" stroke-width="3" fill="none" stroke-linecap="round"/>' +
      '<rect x="22" y="38" width="56" height="8" rx="3"' + O + ' fill="#163d85"/>' +
      '<path d="M30 46 Q50 53 70 46 Z"' + O + ' fill="#1f2a44"/>' +
      '<path d="M50 27.5 l2.8 5.6 6.2 .9 -4.5 4.4 1.1 6.1 -5.6-2.9 -5.6 2.9 1.1-6.1 -4.5-4.4 6.2-.9 z"' + O + ' stroke-width="1.6" fill="#ffd84d"/>' +
      '</svg>',
    red: '<svg viewBox="10 9 80 80" aria-hidden="true">' +
      // floppy black ears
      '<path d="M27 46 Q11 50 15 72 Q18 82 28 76 Q31 62 32 50 Z"' + O + ' fill="#2b2b33"/>' +
      '<path d="M73 46 Q89 50 85 72 Q82 82 72 76 Q69 62 68 50 Z"' + O + ' fill="#2b2b33"/>' +
      // white head with spots
      '<path d="M50 38 Q78 38 79 62 Q79 86 50 86 Q21 86 21 62 Q22 38 50 38 Z"' + O + ' fill="#ffffff"/>' +
      '<circle cx="27" cy="62" r="3" fill="#2b2b33"/><circle cx="72" cy="58" r="2.4" fill="#2b2b33"/>' +
      '<circle cx="66" cy="79" r="2.6" fill="#2b2b33"/><circle cx="33" cy="80" r="2" fill="#2b2b33"/>' +
      '<circle cx="29" cy="74" r="1.6" fill="#2b2b33"/>' +
      eyes("#3b82c4") +
      '<path d="M32 47 Q37 44.5 42 47 M58 47 Q63 44.5 68 47"' + O + ' fill="none"/>' + MOUTH +
      // fire helmet: dome, ridge, wide brim, gold shield
      '<path d="M23 45 Q21 22 50 20 Q79 22 77 45 Z"' + O + ' fill="#e5412d"/>' +
      '<path d="M50 20 Q55 32 52 45 L48 45 Q45 32 50 20 Z"' + O + ' stroke-width="1.8" fill="#b72a1a"/>' +
      '<path d="M31 30 Q36 25 42 24" stroke="#ff9a8a" stroke-width="3" fill="none" stroke-linecap="round"/>' +
      '<path d="M14 46 Q50 38 86 46 Q86 51 80 51 Q50 45 20 51 Q14 51 14 46 Z"' + O + ' fill="#b72a1a"/>' +
      '<path d="M43 27 H57 V36 Q50 43 43 36 Z"' + O + ' stroke-width="1.8" fill="#ffd84d"/>' +
      '<circle cx="50" cy="33" r="2.4" fill="#e5412d"/>' +
      '</svg>'
  };

  // No turn order: kids take turns themselves and may fix any piece at any time.
  var grid, lastMoved, lastFrom, history, winner, selected;
  var boardEl = document.getElementById("board");
  var msgEl = document.getElementById("msg");
  var undoBtn = document.getElementById("undoBtn");

  function canMove(r, c) {
    return !winner && !!grid[r][c];
  }

  function inGoal(p) {
    var n = 0, rows = PLAYERS[p].goal;
    for (var i = 0; i < rows.length; i++) {
      for (var c = 0; c < N; c++) if (grid[rows[i]][c] === p) n++;
    }
    return n;
  }

  function render() {
    boardEl.innerHTML = "";
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var d = document.createElement("div");
        var p = grid[r][c];
        d.className = "sq" + ((r + c) % 2 ? " dark" : "") +
          (canMove(r, c) ? " movable" : "") +
          (selected && selected[0] === r && selected[1] === c ? " sel" : "") +
          ((lastMoved && lastMoved[0] === r && lastMoved[1] === c) ||
           (lastFrom && lastFrom[0] === r && lastFrom[1] === c) ? " last" : "");
        d.dataset.r = r; d.dataset.c = c;
        d.setAttribute("role", "gridcell");
        d.setAttribute("aria-label", String.fromCharCode(97 + c) + (N - r) + ": " +
          (p ? PLAYERS[p].name.toLowerCase() : "prázdne"));
        if (p) d.innerHTML = '<span class="piece ' + p + '">' + look(p) + '</span>';
        boardEl.appendChild(d);
      }
    }
    document.getElementById("sRed").textContent = inGoal("red") + " / " + COUNT;
    document.getElementById("sBlue").textContent = inGoal("blue") + " / " + COUNT;
    undoBtn.disabled = history.length === 0;
    if (!winner) setMsg("");
  }

  var winBox = document.getElementById("winBox");
  function setMsg(t, color) {
    msgEl.textContent = t;
    msgEl.style.color = color || "var(--ink)";
    winBox.classList.toggle("show", !!t);
  }

  function confetti() {
    var wrap = document.getElementById("win");
    wrap.innerHTML = "";
    var cols = ["#e5412d", "#f6c10f", "#38a85a", "#2f6fd6", "#8b4fc2"];
    for (var i = 0; i < 70; i++) {
      var d = document.createElement("div");
      d.className = "conf";
      d.style.left = Math.random() * 100 + "vw";
      d.style.background = cols[i % cols.length];
      d.style.animationDuration = (2 + Math.random() * 2) + "s";
      d.style.animationDelay = (Math.random() * 0.6) + "s";
      wrap.appendChild(d);
    }
    setTimeout(function () { wrap.innerHTML = ""; }, 5000);
  }

  // Pieces live only on the dark squares (same parity as the starting squares).
  function isDark(r, c) { return (r + c) % 2 === 1; }

  function move(fr, fc, tr, tc) {
    if (grid[tr][tc] || !isDark(tr, tc) || (fr === tr && fc === tc)) return false;
    var p = grid[fr][fc];
    history.push({ fr: fr, fc: fc, tr: tr, tc: tc, lastMoved: lastMoved, lastFrom: lastFrom });
    grid[tr][tc] = p;
    grid[fr][fc] = null;
    // Remember where this piece's whole run of moves began, for the yellow trail.
    var continuing = lastMoved && lastMoved[0] === fr && lastMoved[1] === fc;
    lastFrom = continuing ? lastFrom : [fr, fc];
    lastMoved = [tr, tc];
    selected = null;
    if (inGoal(p) === COUNT) {
      winner = p;
      render();
      setMsg(PLAYERS[p].name + " vyhráva! 🎉", p === "red" ? "var(--red)" : "var(--blue)");
      confetti();
    } else {
      render();
    }
    return true;
  }

  function newGame() {
    grid = [];
    for (var r = 0; r < N; r++) {
      grid.push([]);
      for (var c = 0; c < N; c++) grid[r].push(null);
    }
    ["red", "blue"].forEach(function (p) {
      PLAYERS[p].start.forEach(function (row) {
        for (var c = 0; c < N; c++) if ((row + c) % 2) grid[row][c] = p; // dark squares only
      });
    });
    lastMoved = lastFrom = selected = null;
    history = [];
    winner = null;
    document.getElementById("win").innerHTML = "";
    render();
  }

  // ---- input: tap piece then tap square, or drag the piece ----
  var drag = null; // { r, c, x, y, ghost, el }

  function squareAt(x, y) {
    var el = document.elementFromPoint(x, y);
    var sq = el && el.closest && el.closest(".sq");
    return sq && boardEl.contains(sq) ? sq : null;
  }

  function clearDrop() {
    var d = boardEl.querySelectorAll(".sq.drop, .sq.nodrop");
    for (var i = 0; i < d.length; i++) d[i].classList.remove("drop", "nodrop", "blink");
  }

  function sqEl(r, c) { return boardEl.querySelector('.sq[data-r="' + r + '"][data-c="' + c + '"]'); }

  // Blink the light square red so the child sees why the piece did not go there.
  var noTimer = null;
  function flashNo(r, c) {
    if (isDark(r, c)) return;
    var el = sqEl(r, c);
    if (!el) return;
    el.classList.add("nodrop", "blink");
    clearTimeout(noTimer);
    noTimer = setTimeout(function () { el.classList.remove("nodrop", "blink"); }, 950);
  }

  boardEl.addEventListener("pointerdown", function (ev) {
    var sq = ev.target.closest(".sq");
    if (!sq) return;
    var r = Number(sq.dataset.r), c = Number(sq.dataset.c);
    if (canMove(r, c)) {
      ev.preventDefault();
      drag = { r: r, c: c, x: ev.clientX, y: ev.clientY, ghost: null, el: sq, id: ev.pointerId };
      boardEl.setPointerCapture(ev.pointerId);
    } else if (selected && !grid[r][c]) {
      // Tap on a light square keeps the piece picked up, so the child can try again.
      if (!move(selected[0], selected[1], r, c)) { render(); flashNo(r, c); }
    } else {
      selected = null;
      render();
    }
  });

  boardEl.addEventListener("pointermove", function (ev) {
    if (!drag || ev.pointerId !== drag.id) return;
    if (!drag.ghost) {
      if (Math.abs(ev.clientX - drag.x) + Math.abs(ev.clientY - drag.y) < 8) return;
      var piece = drag.el.querySelector(".piece");
      var g = piece.cloneNode(true);
      var size = piece.getBoundingClientRect().width;
      g.classList.add("ghost");
      g.style.width = size + "px";
      document.body.appendChild(g);
      drag.ghost = g;
      drag.el.classList.add("dragging");
    }
    drag.ghost.style.left = ev.clientX + "px";
    drag.ghost.style.top = ev.clientY + "px";
    clearDrop();
    var sq = squareAt(ev.clientX, ev.clientY);
    if (sq) {
      var sr = Number(sq.dataset.r), sc = Number(sq.dataset.c);
      if (!isDark(sr, sc)) sq.classList.add("nodrop");
      else if (!grid[sr][sc]) sq.classList.add("drop");
    }
  });

  function endDrag(ev, cancelled) {
    if (!drag || ev.pointerId !== drag.id) return;
    var d = drag;
    drag = null;
    clearDrop();
    if (d.ghost) {
      d.ghost.remove();
      d.el.classList.remove("dragging");
      var sq = cancelled ? null : squareAt(ev.clientX, ev.clientY);
      if (!sq || !move(d.r, d.c, Number(sq.dataset.r), Number(sq.dataset.c))) {
        render();
        if (sq) flashNo(Number(sq.dataset.r), Number(sq.dataset.c));
      }
      return;
    }
    // Plain tap: pick the piece up, or put it back down if it was already picked.
    selected = selected && selected[0] === d.r && selected[1] === d.c ? null : [d.r, d.c];
    render();
  }
  boardEl.addEventListener("pointerup", function (ev) { endDrag(ev, false); });
  boardEl.addEventListener("pointercancel", function (ev) { endDrag(ev, true); });

  var menu = document.getElementById("menu");
  document.getElementById("menuBtn").addEventListener("click", function () { menu.showModal(); });
  document.getElementById("closeBtn").addEventListener("click", function () { menu.close(); });
  // Tap on the dimmed backdrop closes the menu too.
  menu.addEventListener("click", function (ev) { if (ev.target === menu) menu.close(); });

  document.getElementById("newBtn").addEventListener("click", function () {
    if (history.length && !winner && !confirm("Začať novú hru?")) return;
    menu.close();
    newGame();
  });
  document.getElementById("againBtn").addEventListener("click", newGame);

  undoBtn.addEventListener("click", function () {
    var m = history.pop();
    if (!m) return;
    grid[m.fr][m.fc] = grid[m.tr][m.tc];
    grid[m.tr][m.tc] = null;
    lastMoved = m.lastMoved;
    lastFrom = m.lastFrom;
    selected = null;
    winner = null;
    document.getElementById("win").innerHTML = "";
    menu.close();
    render();
  });

  // ---- custom pictures: picked from the device, kept only in this browser ----
  var KEY = "preskakovana-pic-";
  var pics = {};
  ["blue", "red"].forEach(function (p) {
    try { pics[p] = localStorage.getItem(KEY + p) || null; } catch (e) { pics[p] = null; }
  });

  function look(p) {
    return pics[p] ? '<img src="' + pics[p] + '" alt="">' : FACES[p];
  }

  function paintDots() {
    document.getElementById("dBlue").innerHTML = look("blue");
    document.getElementById("dRed").innerHTML = look("red");
    document.getElementById("mBlue").innerHTML = look("blue");
    document.getElementById("mRed").innerHTML = look("red");
  }

  function setPic(p, url) {
    pics[p] = url;
    try {
      if (url) localStorage.setItem(KEY + p, url); else localStorage.removeItem(KEY + p);
    } catch (e) { /* storage full or blocked: picture still works until reload */ }
    paintDots();
    render();
  }

  // Crop the middle square and shrink it so it stores small and draws fast.
  function loadPic(file, p) {
    var img = new Image();
    var src = URL.createObjectURL(file);
    img.onload = function () {
      var side = Math.min(img.naturalWidth, img.naturalHeight);
      var c = document.createElement("canvas");
      c.width = c.height = 200;
      var g = c.getContext("2d");
      // JPEG has no transparency, so see-through parts (webp/png) would turn black; paint white first.
      g.fillStyle = "#fff";
      g.fillRect(0, 0, 200, 200);
      g.drawImage(img,
        (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 200, 200);
      URL.revokeObjectURL(src);
      setPic(p, c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = function () { URL.revokeObjectURL(src); };
    img.src = src;
  }

  var picFile = document.getElementById("picFile");
  var picFor = null;
  menu.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-pick], [data-clear]");
    if (!b) return;
    if (b.dataset.clear) { setPic(b.dataset.clear, null); return; }
    picFor = b.dataset.pick;
    picFile.value = "";
    picFile.click();
  });
  picFile.addEventListener("change", function () {
    if (picFile.files[0] && picFor) loadPic(picFile.files[0], picFor);
  });

  paintDots();
  newGame();
})();

// iOS Safari ignores user-scalable=no; block pinch via its gesture events.
['gesturestart', 'gesturechange', 'gestureend'].forEach((t) =>
  document.addEventListener(t, (e) => e.preventDefault(), { passive: false })
);
document.addEventListener('touchmove', (e) => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
document.addEventListener('contextmenu', (e) => e.preventDefault());

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
